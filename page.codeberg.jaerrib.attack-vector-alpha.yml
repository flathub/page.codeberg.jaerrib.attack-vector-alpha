id: page.codeberg.jaerrib.attack-vector-alpha
runtime: org.freedesktop.Platform
runtime-version: '25.08'
base: org.godotengine.godot.BaseApp
base-version: '3.6-25.08'
sdk: org.freedesktop.Sdk
command: godot-runner

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=all

modules:
  - name: attackvectoralpha
    buildsystem: simple

    sources:
      - type: git
        url: https://codeberg.org/jaerrib/attack-vector-alpha.git
        commit: 87c77cf198e9b6f745b338ad3e72ffd1f7dcfaa6

      - type: file
        url: https://codeberg.org/jaerrib/attack-vector-alpha/releases/download/1.1/Attack_Vector_Alpha_1-1.pck
        dest-filename: Attack_Vector_Alpha.pck
        sha256: 89b4dd5c4df7196e8d5cb33a047b8db87939cb80352cf6bee6b3a99c4290d8f0

    build-commands:
      - install -Dm644 Attack_Vector_Alpha.pck ${FLATPAK_DEST}/bin/godot-runner.pck
      - install -Dm644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 ${FLATPAK_ID}.png ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
